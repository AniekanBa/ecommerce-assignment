<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Tech Store</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>
    <main>
        <h1>Our Products</h1>
        <div class="product-grid">
            <div class="product-card">
                <h3><a href="product.html">Wireless Mouse</a></h3>
                <p>$25</p>
                <button onclick="addToCart(1, 'Wireless Mouse', 25)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Mechanical Keyboard</h3>
                <p>$80</p>
                <button onclick="addToCart(2, 'Mechanical Keyboard', 80)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>HD Monitor</h3>
                <p>$150</p>
                <button onclick="addToCart(3, 'HD Monitor', 150)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>USB-C Hub</h3>
                <p>$30</p>
                <button onclick="addToCart(4, 'USB-C Hub', 30)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Webcam</h3>
                <p>$45</p>
                <button onclick="addToCart(5, 'Webcam', 45)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Gaming Headset</h3>
                <p>$60</p>
                <button onclick="addToCart(6, 'Gaming Headset', 60)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Laptop Stand</h3>
                <p>$20</p>
                <button onclick="addToCart(7, 'Laptop Stand', 20)">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Bluetooth Speaker</h3>
                <p>$50</p>
                <button onclick="addToCart(8, 'Bluetooth Speaker', 50)">Add to Cart</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
